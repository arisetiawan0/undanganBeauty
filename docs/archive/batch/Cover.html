<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cover Undangan Beauty Raha</title>
    <link rel="icon" type="image/jpeg" href="favicon.jpg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Poppins", system-ui, sans-serif;
            background: radial-gradient(circle at top left, #ffd8ee 0%, #ffcaea 35%, #ffb4df 60%, #ffe9f6 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .cover-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 42px 32px;
            width: 92%;
            max-width: 520px;
            text-align: center;
            border: 1px solid rgba(255, 150, 190, 0.3);
            box-shadow: 0 24px 55px rgba(255,79,159,0.15), 0 0 0 1px rgba(255,255,255,0.5) inset;
            animation: fadeIn 0.8s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logos {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            margin-bottom: 28px;
            flex-wrap: nowrap;
        }
        .logos img {
            height: 65px;
            object-fit: contain;
            filter: drop-shadow(0 3px 8px rgba(255,79,159,0.35)) drop-shadow(0 0 20px rgba(255,150,200,0.25));
            transition: transform .3s ease;
        }
        .logos img:hover {
            transform: translateY(-3px) scale(1.05);
        }
        .title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #ff1f8f;
            margin-bottom: 8px;
            text-shadow: 0 0 8px rgba(255,68,155,0.35);
        }
        .subtitle {
            font-size: 1rem;
            color: #5a3a4a;
            font-weight: 500;
            margin-bottom: 28px;
        }
        .btn-enter {
            padding: 14px 36px;
            background: linear-gradient(135deg, #ff4c9d, #ff78b9);
            color: #fff;
            border-radius: 999px;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 700;
            border: 1px solid rgba(255,255,255,0.6);
            box-shadow: 0 8px 22px rgba(255,76,157,0.4);
            transition: transform .25s ease, box-shadow .25s ease, filter .25s ease;
            display: inline-block;
        }
        .btn-enter:hover {
            background: linear-gradient(135deg, #e23788, #ff5ca8);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 30px rgba(255,76,157,0.5), 0 0 25px rgba(255,76,157,0.25);
            filter: brightness(1.05);
        }
        .btn-enter:active {
            transform: translateY(-1px) scale(0.98);
        }
        @media(max-width: 480px){
            body { padding: 12px; background: #fde1ec; }
            .cover-card {
                width: 95%;
                border-radius: 24px;
                padding: 32px 22px;
                margin: 0 auto;
            }
            .logos { margin-bottom: 24px; }
            .logos img { height: 55px; }
            .title { font-size: 1.55rem; }
            .subtitle { font-size: 0.9rem; margin-bottom: 22px; }
            .btn-enter { font-size: 0.95rem; padding: 12px 28px; transition: transform .25s ease, box-shadow .25s ease, filter .25s ease; }
            .btn-enter:hover { transform: translateY(-2px) scale(1.01); }
        }
        @media(max-width: 360px){
            .cover-card { padding: 26px 18px; }
            .logos { margin-bottom: 20px; }
            .logos img { height: 48px; }
            .title { font-size: 1.4rem; }
            .subtitle { font-size: 0.85rem; }
            .btn-enter { font-size: 0.9rem; padding: 11px 24px; }
        }
    </style>
</head>
<body>
<div class="cover-card">
    <div class="logos">
        <img src="beauty-logo.png" alt="Beauty Logo" width="150" style="margin: 0 auto; display: block;">
    </div>
    <div class="title">Grand Opening Beauty Raha</div>
    <div class="subtitle">Undangan • 10 April 2026 • 09.30 WITA</div>
    <a href="content.html" class="btn-enter">Buka Undangan</a>
</div>
</body>
</html>
